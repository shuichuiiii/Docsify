<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Docsify 文档站点">
  <title>Docsify 文档</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>:root { --theme-color: #3b82f6; } .markdown-section { max-width: 900px; }</style>
</head>
<body>
  <div id="app">正在加载文档…</div>
  <script>
    window.$docsify = {
      name: 'Docsify 文档',
      repo: 'https://github.com/shuichuiiii/Docsify',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      search: { placeholder: '搜索文档', noData: '没有找到结果', depth: 3 },
      copyCode: { buttonText: '复制', successText: '已复制', errorText: '复制失败' },
      pagination: { previousText: '上一页', nextText: '下一页', crossChapter: true }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
</body>
</html>
